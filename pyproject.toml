[project]
name = "codesage"
version = "0.1.0"
description = "Hybrid RAG system for codebases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "gitpython>=3.1",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "pinecone>=9.0.0",
    "rank-bm25>=0.2",
    "sentence-transformers>=3.0",
    "python-dotenv>=1.0",
    "groq>=0.9",
    "nltk>=3.8",
    "einops>=0.8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
