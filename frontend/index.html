<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository Explainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'system-ui', 'sans-serif'],
                        mono: ['"SF Mono"', '"Cascadia Code"', '"Fira Code"', 'monospace'],
                    },
                    colors: {
                        base: 'oklch(0.13 0.002 260)',
                        surface: {
                            DEFAULT: 'oklch(0.16 0.002 260)',
                            raised: 'oklch(0.19 0.002 260)',
                        },
                        edge: {
                            DEFAULT: 'oklch(0.22 0.002 260)',
                            hover: 'oklch(0.28 0.002 260)',
                        },
                        content: {
                            primary: 'oklch(0.85 0.002 260)',
                            secondary: 'oklch(0.58 0.002 260)',
                            muted: 'oklch(0.40 0.002 260)',
                            dim: 'oklch(0.28 0.002 260)',
                        },
                        button: {
                            bg: 'oklch(0.22 0.002 260)',
                            hover: 'oklch(0.30 0.002 260)',
                            text: 'oklch(0.90 0.002 260)',
                        },
                        dot: {
                            active: 'oklch(0.72 0.002 260)',
                            inactive: 'oklch(0.30 0.002 260)',
                            focus: 'oklch(0.65 0.002 260)',
                        }
                    },
                    borderRadius: {
                        DEFAULT: '4px',
                        sm: '3px',
                        md: '5px',
                    },
                    keyframes: {
                        'progress': {
                            '0%': { transform: 'scaleX(0)', opacity: '1' },
                            '80%': { opacity: '1' },
                            '100%': { transform: 'scaleX(1)', opacity: '0' },
                        }
                    },
                    animation: {
                        'progress': 'progress 2s ease-out forwards',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: oklch(0.13 0.002 260);
        }
        input:focus, textarea:focus, button:focus-visible {
            outline: none;
        }
        .input-bar:focus-within {
            border-color: oklch(0.65 0.002 260);
        }
        .btn-primary {
            transition: background-color 150ms ease-out, border-color 150ms ease-out, opacity 150ms ease-out;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: oklch(0.30 0.002 260);
        }
        .btn-primary:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .hoverable {
            transition: border-color 150ms ease-out;
        }
        .hoverable:hover {
            border-color: oklch(0.28 0.002 260);
        }
        ::selection {
            background: oklch(0.50 0.002 260 / 0.20);
        }
        textarea {
            field-sizing: content;
            min-height: 3.25rem;
            max-height: 14rem;
        }
        .meta-row {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }
        .meta-label {
            font-size: 1rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: oklch(0.40 0.002 260);
            white-space: nowrap;
        }
        .meta-value {
            font-family: "SF Mono", "Cascadia Code", "Fira Code", monospace;
            font-size: 1.125rem;
            color: oklch(0.58 0.002 260);
        }

        /* Markdown Body Styles */
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            font-weight: 600;
            color: oklch(0.90 0.002 260);
            margin-top: 1.75rem;
            margin-bottom: 0.75rem;
        }
        .markdown-body h1 { font-size: 1.625rem; }
        .markdown-body h2 { font-size: 1.375rem; border-bottom: 1px solid oklch(0.22 0.002 260); padding-bottom: 0.35rem; }
        .markdown-body h3 { font-size: 1.25rem; }
        
        .markdown-body p {
            margin-bottom: 1.125rem;
            line-height: 1.75;
            color: oklch(0.85 0.002 260);
        }
        
        .markdown-body ul {
            list-style-type: disc;
            padding-left: 1.75rem;
            margin-bottom: 1.125rem;
        }
        
        .markdown-body ol {
            list-style-type: decimal;
            padding-left: 1.75rem;
            margin-bottom: 1.125rem;
        }
        
        .markdown-body li {
            margin-bottom: 0.5rem;
            line-height: 1.7;
        }
        
        .markdown-body code {
            font-family: "SF Mono", "Cascadia Code", "Fira Code", monospace;
            font-size: 0.8125em;
            background-color: oklch(0.18 0.002 260);
            padding: 0.15rem 0.35rem;
            border-radius: 4px;
            color: oklch(0.92 0.002 260);
            border: 1px solid oklch(0.24 0.002 260);
        }
        
        .markdown-body pre {
            background-color: oklch(0.16 0.002 260);
            border: 1px solid oklch(0.22 0.002 260);
            border-radius: 6px;
            padding: 1.25rem;
            overflow-x: auto;
            margin-bottom: 1.375rem;
        }
        
        .markdown-body pre code {
            background-color: transparent;
            border: none;
            padding: 0;
            font-size: 0.875rem;
            line-height: 1.6;
            color: oklch(0.85 0.002 260);
        }

        .markdown-body a {
            color: oklch(0.72 0.002 260);
            text-decoration: underline;
            transition: color 150ms ease-out;
        }
        .markdown-body a:hover {
            color: oklch(0.85 0.002 260);
        }

        /* Active dot pulsing animation */
        .dot-pulse {
            box-shadow: 0 0 0 0 oklch(0.65 0.002 260 / 0.7);
            animation: pulse-dot 1.5s infinite cubic-bezier(0.66, 0, 0, 1);
        }
        
        @keyframes pulse-dot {
            to {
                box-shadow: 0 0 0 8px oklch(0.65 0.002 260 / 0);
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="font-sans text-content-primary antialiased min-h-screen text-[1.375rem]">

    <div class="mx-auto max-w-[48rem] px-8 pt-24 pb-32">

        <!-- Top bar -->
        <header class="flex items-center justify-between mb-14">
            <h1 class="font-mono text-[2.5rem] font-semibold tracking-tight text-content-primary">Repository Explainer</h1>
            <div id="repo-status" class="flex items-center gap-2 text-[1.125rem] text-content-muted">
                <span class="w-2 h-2 rounded-full bg-dot-inactive"></span>
                Not indexed
            </div>
        </header>

        <!-- Index -->
        <section class="mb-14">
            <div class="flex items-baseline justify-between mb-5">
                <h2 class="text-[1rem] font-medium uppercase tracking-[0.08em] text-content-secondary">Index</h2>
            </div>

            <form id="index-form" class="flex gap-3">
                <div class="input-bar flex-1 flex items-center border border-edge rounded bg-surface hoverable">
                    <input
                        type="text"
                        id="repo-url"
                        placeholder="github.com/user/repo"
                        class="flex-1 bg-transparent text-[1.375rem] text-content-primary placeholder:text-content-muted py-3.5 px-4"
                        required
                    >
                </div>
                <button
                    type="submit"
                    id="index-btn"
                    class="btn-primary px-5 py-3.5 rounded bg-button-bg text-button-text border border-edge text-[1.375rem] font-medium leading-none"
                >
                    Index
                </button>
            </form>

            <!-- Progress line -->
            <div id="index-progress" class="hidden mt-3.5 h-px bg-edge overflow-hidden rounded">
                <div class="h-full bg-content-secondary origin-left animate-progress"></div>
            </div>

            <!-- Status text -->
            <div id="index-status" class="hidden mt-3 flex items-center gap-2 text-[1.375rem]">
                <span id="index-status-dot" class="w-[3px] h-[3px] rounded-full shrink-0 bg-dot-active"></span>
                <span id="index-status-text" class="text-content-secondary"></span>
            </div>
        </section>

        <!-- Metadata -->
        <section id="metadata-section" class="hidden mb-14">
            <div class="flex items-baseline justify-between mb-5">
                <h2 class="text-[1rem] font-medium uppercase tracking-[0.08em] text-content-secondary">Metadata</h2>
            </div>

            <div id="metadata-content" class="space-y-3">
                <div id="meta-project" class="hidden">
                    <div class="meta-row">
                        <span class="meta-label">Project</span>
                        <span id="meta-project-value" class="meta-value"></span>
                    </div>
                </div>
                <div id="meta-description" class="hidden">
                    <div class="meta-row">
                        <span class="meta-label">Description</span>
                        <span id="meta-description-value" class="meta-value"></span>
                    </div>
                </div>
                <div id="meta-languages" class="hidden">
                    <div class="meta-row">
                        <span class="meta-label">Languages</span>
                        <span id="meta-languages-value" class="meta-value"></span>
                    </div>
                </div>
                <div id="meta-frameworks" class="hidden">
                    <div class="meta-row">
                        <span class="meta-label">Frameworks</span>
                        <span id="meta-frameworks-value" class="meta-value"></span>
                    </div>
                </div>
                <div id="meta-orms" class="hidden">
                    <div class="meta-row">
                        <span class="meta-label">ORMs</span>
                        <span id="meta-orms-value" class="meta-value"></span>
                    </div>
                </div>
                <div id="meta-databases" class="hidden">
                    <div class="meta-row">
                        <span class="meta-label">Databases</span>
                        <span id="meta-databases-value" class="meta-value"></span>
                    </div>
                </div>
                <div id="meta-auth" class="hidden">
                    <div class="meta-row">
                        <span class="meta-label">Auth</span>
                        <span id="meta-auth-value" class="meta-value"></span>
                    </div>
                </div>
                <div id="meta-files" class="hidden">
                    <div class="meta-row">
                        <span class="meta-label">Files</span>
                        <span id="meta-files-value" class="meta-value"></span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Divider -->
        <div class="h-px bg-edge mb-14"></div>

        <!-- Query -->
        <section>
            <div class="flex items-baseline justify-between mb-5">
                <h2 class="text-[1rem] font-medium uppercase tracking-[0.08em] text-content-secondary">Query</h2>
            </div>

            <form id="query-form" class="mb-7">
                <div class="input-bar border border-edge rounded bg-surface hoverable">
                    <textarea
                        id="question"
                        placeholder="How does authentication work?"
                        rows="1"
                        class="w-full bg-transparent text-[1.375rem] text-content-primary placeholder:text-content-muted py-3.5 px-4 resize-none"
                    ></textarea>
                </div>
                <div class="flex justify-end mt-3">
                    <button
                        type="submit"
                        id="query-btn"
                        class="btn-primary px-5 py-3.5 rounded bg-button-bg text-button-text border border-edge text-[1.375rem] font-medium leading-none"
                    >
                        Query
                    </button>
                </div>
            </form>

            <!-- Query disabled state -->
            <div id="query-disabled" class="text-content-dim italic py-1.5">
                Index a repository to query
            </div>

            <!-- Results -->
            <div id="query-result" class="hidden">
                <!-- Query Progress/Status Steps -->
                <div id="query-progress-steps" class="hidden mb-8 space-y-4">
                    <div id="step-search" class="flex items-center gap-3.5">
                        <span id="step-search-dot" class="w-[8px] h-[8px] rounded-full shrink-0 bg-dot-inactive transition-all duration-300"></span>
                        <span id="step-search-text" class="text-content-muted font-mono tracking-tight uppercase text-[0.875rem] font-semibold">Searching Codebase (Sparse & Dense Fusion)...</span>
                    </div>
                    <div id="step-generate" class="flex items-center gap-3.5">
                        <span id="step-generate-dot" class="w-[8px] h-[8px] rounded-full shrink-0 bg-dot-inactive transition-all duration-300"></span>
                        <span id="step-generate-text" class="text-content-muted font-mono tracking-tight uppercase text-[0.875rem] font-semibold">Synthesizing Answer (Llama 3.1)...</span>
                    </div>
                </div>

                <div id="answer-text" class="markdown-body text-[1.375rem] text-content-primary leading-[1.7]"></div>

                <!-- Citations row -->
                <div id="citations" class="hidden mt-6 pt-4 border-t border-edge">
                    <div class="meta-row">
                        <span class="meta-label">Citations</span>
                        <span id="citations-values" class="meta-value"></span>
                    </div>
                </div>

                <!-- Files row -->
                <div id="relevant-file" class="hidden mt-3">
                    <div class="meta-row">
                        <span class="meta-label">Files</span>
                        <span id="files-values" class="meta-value"></span>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <!-- Code Explorer Modal -->
    <div id="code-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-8 bg-base/85 backdrop-blur-sm transition-all duration-300">
        <div class="w-full max-w-[56rem] max-h-[85vh] flex flex-col bg-surface border border-edge rounded-lg shadow-2xl overflow-hidden">
            <!-- Header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-edge">
                <div class="flex items-center gap-2.5">
                    <svg class="w-5 h-5 text-content-secondary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5"></path>
                    </svg>
                    <span id="modal-filepath" class="font-mono text-[1.125rem] text-content-primary font-semibold"></span>
                </div>
                <button onclick="window.closeCodeModal()" class="text-content-muted hover:text-content-primary transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <!-- Code container -->
            <div class="flex-1 overflow-auto p-6 font-mono text-[0.875rem] leading-[1.6] bg-base text-content-primary">
                <pre class="w-full h-full"><code id="modal-code-content" class="block w-full whitespace-pre overflow-x-auto"></code></pre>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
