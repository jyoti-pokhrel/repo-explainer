<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository Explainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'system-ui', 'sans-serif'],
                        mono: ['"SF Mono"', '"Cascadia Code"', '"Fira Code"', 'monospace'],
                    },
                    colors: {
                        base: 'oklch(0.14 0.003 260)',
                        surface: {
                            DEFAULT: 'oklch(0.17 0.004 260)',
                            raised: 'oklch(0.20 0.004 260)',
                        },
                        edge: {
                            DEFAULT: 'oklch(0.24 0.005 260)',
                            hover: 'oklch(0.30 0.006 260)',
                        },
                        content: {
                            primary: 'oklch(0.82 0.005 260)',
                            secondary: 'oklch(0.58 0.006 260)',
                            muted: 'oklch(0.42 0.004 260)',
                            dim: 'oklch(0.32 0.003 260)',
                        },
                        accent: {
                            DEFAULT: 'oklch(0.60 0.12 195)',
                            hover: 'oklch(0.66 0.12 195)',
                            surface: 'oklch(0.60 0.12 195 / 0.10)',
                        },
                        state: {
                            ok: 'oklch(0.62 0.14 155)',
                            fail: 'oklch(0.58 0.18 25)',
                            busy: 'oklch(0.65 0.10 210)',
                        }
                    },
                    borderRadius: {
                        DEFAULT: '4px',
                        sm: '3px',
                        md: '5px',
                    },
                    keyframes: {
                        'progress': {
                            '0%': { transform: 'scaleX(0)', opacity: '1' },
                            '80%': { opacity: '1' },
                            '100%': { transform: 'scaleX(1)', opacity: '0' },
                        }
                    },
                    animation: {
                        'progress': 'progress 2s ease-out forwards',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: oklch(0.14 0.003 260);
        }
        input:focus, textarea:focus, button:focus-visible {
            outline: none;
        }
        .input-bar:focus-within {
            border-color: oklch(0.60 0.12 195);
        }
        .btn-primary {
            transition: background-color 150ms ease-out, opacity 150ms ease-out;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: oklch(0.66 0.12 195);
        }
        .btn-primary:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .hoverable {
            transition: border-color 150ms ease-out;
        }
        .hoverable:hover {
            border-color: oklch(0.30 0.006 260);
        }
        ::selection {
            background: oklch(0.60 0.12 195 / 0.25);
        }
        textarea {
            field-sizing: content;
            min-height: 2.25rem;
            max-height: 10rem;
        }
        .meta-row {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }
        .meta-label {
            font-size: 0.6875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: oklch(0.42 0.004 260);
            white-space: nowrap;
        }
        .meta-value {
            font-family: "SF Mono", "Cascadia Code", "Fira Code", monospace;
            font-size: 0.75rem;
            color: oklch(0.58 0.006 260);
        }
    </style>
</head>
<body class="font-sans text-content-primary antialiased min-h-screen">

    <div class="mx-auto max-w-[40rem] px-5 pt-12 pb-24">

        <!-- Top bar -->
        <header class="flex items-center justify-between mb-10">
            <h1 class="text-[0.8125rem] font-medium tracking-tight text-content-primary">Repository Explainer</h1>
            <div id="repo-status" class="flex items-center gap-1.5 text-[0.6875rem] text-content-muted">
                <span class="w-1 h-1 rounded-full bg-content-muted"></span>
                Not indexed
            </div>
        </header>

        <!-- Index -->
        <section class="mb-8">
            <div class="flex items-baseline justify-between mb-3">
                <h2 class="text-[0.6875rem] font-medium uppercase tracking-[0.06em] text-content-secondary">Index</h2>
            </div>

            <form id="index-form" class="flex gap-2">
                <div class="input-bar flex-1 flex items-center border border-edge rounded bg-surface hoverable">
                    <input
                        type="text"
                        id="repo-url"
                        placeholder="github.com/user/repo"
                        class="flex-1 bg-transparent text-[0.8125rem] text-content-primary placeholder:text-content-muted py-[0.4375rem] px-2.5"
                        required
                    >
                </div>
                <button
                    type="submit"
                    id="index-btn"
                    class="btn-primary px-3 py-[0.4375rem] rounded bg-accent text-white text-[0.8125rem] font-medium leading-none"
                >
                    Index
                </button>
            </form>

            <!-- Progress line -->
            <div id="index-progress" class="hidden mt-2.5 h-px bg-edge overflow-hidden rounded">
                <div class="h-full bg-accent origin-left animate-progress"></div>
            </div>

            <!-- Status text -->
            <div id="index-status" class="hidden mt-2 flex items-center gap-1.5 text-[0.8125rem]">
                <span id="index-status-dot" class="w-1 h-1 rounded-full shrink-0"></span>
                <span id="index-status-text" class="text-content-secondary"></span>
            </div>
        </section>

        <!-- Divider -->
        <div class="h-px bg-edge mb-8"></div>

        <!-- Query -->
        <section>
            <div class="flex items-baseline justify-between mb-3">
                <h2 class="text-[0.6875rem] font-medium uppercase tracking-[0.06em] text-content-secondary">Query</h2>
            </div>

            <form id="query-form" class="mb-5">
                <div class="input-bar border border-edge rounded bg-surface hoverable">
                    <textarea
                        id="question"
                        placeholder="How does authentication work?"
                        rows="1"
                        class="w-full bg-transparent text-[0.8125rem] text-content-primary placeholder:text-content-muted py-[0.4375rem] px-2.5 resize-none"
                    ></textarea>
                </div>
                <div class="flex justify-end mt-2">
                    <button
                        type="submit"
                        id="query-btn"
                        class="btn-primary px-3 py-[0.4375rem] rounded bg-accent text-white text-[0.8125rem] font-medium leading-none"
                    >
                        Query
                    </button>
                </div>
            </form>

            <!-- Query disabled state -->
            <div id="query-disabled" class="text-[0.8125rem] text-content-dim py-1">
                Index a repository to query
            </div>

            <!-- Results -->
            <div id="query-result" class="hidden">
                <div id="answer-text" class="text-[0.8125rem] text-content-primary leading-[1.65] whitespace-pre-wrap"></div>

                <!-- Citations row -->
                <div id="citations" class="hidden mt-4 pt-3 border-t border-edge">
                    <div class="meta-row">
                        <span class="meta-label">Citations</span>
                        <span id="citations-values" class="meta-value"></span>
                    </div>
                </div>

                <!-- Files row -->
                <div id="relevant-file" class="hidden mt-2">
                    <div class="meta-row">
                        <span class="meta-label">Files</span>
                        <span id="files-values" class="meta-value"></span>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
